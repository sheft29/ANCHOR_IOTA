// ---- cloud layer (no-op unless configured + signed in) ----
// Optional end-to-end passphrase encryption: when a passphrase is set, the copy that leaves the
// device is AES-GCM ciphertext (the server never sees plaintext). The device copy stays plain.
let passphrase=null,userSalt=null,lockedBlob=null;
try{passphrase=sessionStorage.getItem('anchor_pp')||null;}catch(e){}
const _b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))), _ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function _key(pp,salt){const e=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',e.encode(pp),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:_ub(salt),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function _enc(obj){if(!userSalt)userSalt=_b64(crypto.getRandomValues(new Uint8Array(16)));
  const k=await _key(passphrase,userSalt),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj)));
  return {enc:_b64(ct),iv:_b64(iv),salt:userSalt};}
async function _dec(blob){const k=await _key(passphrase,blob.salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:_ub(blob.iv)},k,_ub(blob.enc));
  return JSON.parse(new TextDecoder().decode(pt));}
function pushRemoteSoon(){ if(!supa||!user||lockedBlob)return; clearTimeout(saveTmr);
  saveTmr=setTimeout(async()=>{try{const payload=passphrase?await _enc(S):S;
    await supa.from('anchor_state').upsert({user_id:user.id,data:payload,updated_at:new Date().toISOString()});}catch(e){}},800);}
async function initCloud(){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY||!window.supabase)return;
  try{
    supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const {data:{session}}=await supa.auth.getSession();
    if(session&&session.user){user=session.user;await loadRemote();render();}
    supa.auth.onAuthStateChange(async(ev,sess)=>{const wasOut=!user;user=sess&&sess.user?sess.user:null;
      if(user&&wasOut){await loadRemote();render();}});
  }catch(e){supa=null;}
}
async function loadRemote(){ if(!supa||!user)return;
  try{const {data}=await supa.from('anchor_state').select('data').eq('user_id',user.id).maybeSingle();
    const d=data&&data.data;
    if(d&&d.enc){ userSalt=d.salt;
      if(passphrase){try{S=await _dec(d);lockedBlob=null;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){}}catch(e){lockedBlob=d;}}
      else lockedBlob=d;
    } else if(d&&d.v===2){ S=d;lockedBlob=null;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
    else { await supa.from('anchor_state').upsert({user_id:user.id,data:passphrase?await _enc(S):S,updated_at:new Date().toISOString()}); }
  }catch(e){}}
function setPassphrase(pp){passphrase=pp;try{sessionStorage.setItem('anchor_pp',pp);}catch(e){}pushRemoteSoon();}
async function unlockWith(pp){if(!lockedBlob)return false;passphrase=pp;
  try{S=await _dec(lockedBlob);try{sessionStorage.setItem('anchor_pp',pp);}catch(_){}lockedBlob=null;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){}return true;}
  catch(e){passphrase=null;return false;}}
function signInEmail(email){return supa.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});}
async function signInGoogle(){try{const {data,error}=await supa.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0],skipBrowserRedirect:true}});
  if(error||!data||!data.url)return false;location.href=data.url;return true;}catch(e){return false;}}
function signOutCloud(){if(supa)supa.auth.signOut();user=null;passphrase=null;lockedBlob=null;try{sessionStorage.removeItem('anchor_pp');}catch(e){}render();}
function applyTheme(){const r=document.documentElement;if(S.theme)r.setAttribute('data-theme',S.theme);else r.removeAttribute('data-theme');}

// ---------- onboarding (the Get Anchor form) ----------
const OB=[
 {k:"name",type:"text",q:"What should we call you?",place:"First name"},
 {k:"more",type:"single",q:"What would you most like more of right now?",
  opts:["Energy, exercise, good sleep","Calm, steady mood","Focus or curiosity","Closeness with people","Financial footing","Direction in school or work","Meaning and purpose","Not sure, pick for me"]},
 {k:"self",type:"multi",max:2,q:"What usually leaves you feeling most like yourself?",hint:"Choose up to two.",
  opts:["Moving my body","Making something","Being with people","Quiet time alone","Learning something new","Being outdoors"]},
 {k:"much",type:"multi",max:2,q:"What takes up more of your time than you'd like?",hint:"Choose up to two.",
  opts:["Phone and screens","Schoolwork or work","Being alone","Worrying or overthinking","Nothing, it feels about right"]},
 {k:"time",type:"single",q:"How much time could you give one small thing on a normal day?",
  opts:["Under 5 minutes","About 10 minutes","About 15 minutes"]},
 {k:"barrier",type:"multi",max:2,q:"When you mean to do something and it doesn't happen, what gets in the way?",hint:"Choose up to two.",
  opts:["Not enough time","Too tired","I don't feel like it when the time comes","It feels like too much","I'm not sure where to start","I forget"]},
 {k:"small",type:"text",q:"What's one small thing you've been meaning to do?",hint:"Anything counts. Optional.",place:"Optional",optional:true},
 {k:"context",type:"single",q:"Before your Anchor each day, want the option to add a little about your day first?",
  opts:["Yes, give me the option","No, just the Anchor"]},
];
const DIM_OF_MORE={"Energy, exercise, good sleep":"PHYSICAL","Calm, steady mood":"EMOTIONAL","Focus or curiosity":"INTELLECTUAL","Closeness with people":"SOCIAL","Financial footing":"FINANCIAL","Direction in school or work":"OCCUPATIONAL","Meaning and purpose":"SPIRITUAL","Not sure, pick for me":null};
const WANT_PILLAR={"Energy, exercise, good sleep":"STABILITY","Calm, steady mood":"PEACE","Focus or curiosity":"PEACE","Closeness with people":"STABILITY","Financial footing":"STABILITY","Direction in school or work":"STABILITY","Meaning and purpose":"PEACE"};
const CEIL={"Under 5 minutes":5,"About 10 minutes":10,"About 15 minutes":15};
const PILLAR_WORD={PEACE:"quiet and attention",STABILITY:"steadiness and the basics",EXPRESSION:"making something"};

// ---------- adaptive engine ----------
function ceiling(){return CEIL[S.profile.time]||10;}
function hay(a){return((a.name||"")+" "+(a.instruction||"")+" "+(a.learnMore||"")).toLowerCase();}
function has(a,re){return re.test(hay(a));}
const MODE_RE={move:/\b(walk|run|jog|move|stretch|exercise|lift|bike|swim|yoga)\b,/.source,};
const MODE_MATCH={
 "Moving my body":a=>a.modes.includes("move")||a.pillar=="STABILITY"&&has(a,/walk|run|move|exercise/),
 "Making something":a=>a.pillar=="EXPRESSION",
 "Being with people":a=>a.modes.includes("people"),
 "Quiet time alone":a=>a.modes.includes("quiet")||a.pillar=="PEACE",
 "Learning something new":a=>a.modes.includes("learn"),
 "Being outdoors":a=>a.modes.includes("outdoors")};
function hasCue(a){return has(a,/alarm|cue|remind|before you|next time|when you|leave .* out|set a|on paper/);}
function servedPillarCounts(){const c={PEACE:0,STABILITY:0,EXPRESSION:0};S.log.forEach(e=>{if(e.pillar)c[e.pillar]++;});return c;}
function lowEnergy(){return S.contextToday==="low";}
function score(a){
 if(S.exclude.includes(a.id))return -1e9;
 let s=0; const p=S.profile;
 // onboarding priors
 const td=DIM_OF_MORE[p.more]; if(td&&a.dim==td)s+=4;
 const wp=WANT_PILLAR[p.more]; if(wp&&a.pillar==wp)s+=1.5;
 if(a.priority)s+=1.2;
 (p.self||[]).forEach(m=>{if(MODE_MATCH[m]&&MODE_MATCH[m](a))s+=2;});
 const bar=p.barrier||[], tired=lowEnergy()||bar.includes("Too tired")||bar.includes("It feels like too much");
 if(tired)s+=(a.min<=5?2:a.min<=10?.5:-1.5);
 if(bar.includes("Not enough time"))s+=(a.min<=5?2:0);
 if(bar.includes("I'm not sure where to start"))s+=a.priority?1.3:0;
 if(bar.includes("I forget")&&hasCue(a))s+=1.1;
 const much=p.much||[];
 if(much.includes("Phone and screens")&&has(a,/phone|screen|call|walk|outside|notification|scroll/))s+=1.3;
 if(much.includes("Being alone")&&a.modes.includes("people"))s+=1.3;
 if(much.includes("Worrying or overthinking")&&has(a,/breath|ground|present|worry|write|name|slow/))s+=1.3;
 const sm=(p.small||"").toLowerCase().replace(/[^a-z ]/g,'');
 if(sm.length>3)sm.split(/\s+/).filter(w=>w.length>4).forEach(w=>{if(has(a,new RegExp("\\b"+w)))s+=2.5;});
 // learned weights (feedback + context)
 s+=(S.learn.pillar[a.pillar]||0)*1.1;
 (a.modes||[]).forEach(m=>{s+=(S.learn.mode[m]||0)*0.5;});
 if(S.learn.effort>0)s+=(a.min<=5?S.learn.effort:a.min>=15?-S.learn.effort*0.8:0);
 // pillar balance: keep roughly equal
 const pc=servedPillarCounts(); const avg=(pc.PEACE+pc.STABILITY+pc.EXPRESSION)/3;
 s+=(avg-pc[a.pillar])*0.7;
 // freshness
 const i=S.served.lastIndexOf(a.id); if(i>=0)s-=(S.served.length-i<=6?6:2);
 s+=Math.random()*0.35;
 return s;
}
function ranked(){
 let pool=C.anchors.filter(a=>a.min!=null&&a.min<=ceiling()&&!S.exclude.includes(a.id));
 let relaxed=false;
 if(!pool.length){pool=C.anchors.filter(a=>!S.exclude.includes(a.id));relaxed=true;}
 pool=pool.map(a=>({a,s:score(a)})).sort((x,y)=>y.s-x.s);
 return {list:pool.map(p=>p.a),relaxed};
}
function learnFrom(e){
 let w=0;
 if(e.helpful)w=e.helpful-3;            // -2..+2
 if(e.did==="No")w=Math.min(w,-1);
 if(e.off==="not-for-me"){w=-2; if(!S.exclude.includes(e.id))S.exclude.push(e.id);}
 if(e.off==="already")w=Math.min(w,-0.5);
 S.learn.pillar[e.pillar]=(S.learn.pillar[e.pillar]||0)*0.9+w*0.5;
 (e.modes||[]).forEach(m=>{S.learn.mode[m]=(S.learn.mode[m]||0)*0.9+w*0.3;});
 if(e.off==="too-much")S.learn.effort=Math.min(3,S.learn.effort+1);
 else if(e.did==="No")S.learn.effort=Math.min(3,S.learn.effort+0.5);
 else if(e.helpful>=4&&e.min>=15)S.learn.effort=Math.max(-1,S.learn.effort-0.5);
}
// ---------- "chosen because", personalized + adaptive ----------
function because(a){
 const p=S.profile, bits=[];
 const td=DIM_OF_MORE[p.more];
 const strongest=Object.entries(S.learn.pillar).sort((x,y)=>y[1]-x[1])[0];
 const pc=servedPillarCounts(), done=S.log.length;
 if(done>=2 && strongest[1]>0.6 && a.pillar===strongest[0])
   bits.push("lately "+PILLAR_WORD[a.pillar]+" has been landing for you");
 else if(done>=3 && (pc[a.pillar]===Math.min(pc.PEACE,pc.STABILITY,pc.EXPRESSION)))
   bits.push(PILLAR_WORD[a.pillar]+" has had less room this week");
 else if(td&&a.dim==td) bits.push("you said you'd like more "+(p.more||"").toLowerCase().replace(/,.*/,''));
 if(lowEnergy()) bits.push("today's a low-energy day, so it's small");
 else { const m=(p.self||[]).find(x=>MODE_MATCH[x]&&MODE_MATCH[x](a)); if(m)bits.push('it fits "'+m.toLowerCase()+'"'); }
 if(!bits.length) bits.push("it fits the time you have today");
 return bits.slice(0,2).join(", and ")+".";
}

 const gsaved=$(`<div class="savedtag" style="margin-top:6px">✓ Saved</div>`);
 gi.oninput=()=>{S.memory.goal=gi.value.trim();save();gsaved.classList.add('on');};
 gw.appendChild(gi);gw.appendChild(gsaved);c.appendChild(gw);
 box.appendChild(c);
 // memory
 const m=$(`<div class="card"></div>`);
 m.appendChild($(`<div class="eyebrow">Memory</div>`));
 const jc=S.journal.filter(j=>j.text&&j.text.trim()).length, dc=completions();
 m.appendChild($(`<p class="dim" style="font-size:13px;margin-top:10px">Everything Anchor keeps is on this device only, and you can delete it. ${dc} ${dc===1?'anchor':'anchors'} done, ${jc} ${jc===1?'line':'lines'} written.</p>`));
 const pr=$(`<details><summary>What it has learned about you</summary></details>`);
 const lean=Object.entries(S.learn.pillar).sort((a,b)=>b[1]-a[1]);
 pr.appendChild($(`<p class="dim" style="font-size:13px;margin-top:10px">Leaning toward: ${PILLAR_WORD[lean[0][0]]}${lean[0][1]>0.4?' (you\'ve rated these well)':' (early days)'}.<br>From your start: wants more ${(S.profile.more||'—').toLowerCase()}, feels like yourself when ${(S.profile.self||[]).join(" or ").toLowerCase()||'—'}.</p>`));
 m.appendChild(pr);
 const del=$(`<button class="btn outline" style="margin-top:16px;color:var(--rust);border-color:var(--rust)">Delete all my data</button>`);
 del.onclick=()=>{if(confirm("Delete everything Anchor has stored on this device? This can't be undone."))resetAll();};
 m.appendChild(del);box.appendChild(m);
 // account / cloud sync
 const ac=$(`<div class="card"></div>`);
 ac.appendChild($(`<div class="eyebrow">Account</div>`));
 if(!supa){
   ac.appendChild($(`<p class="dim" style="font-size:13px;margin-top:10px">This build saves to your device. Connect a Supabase project (see SETUP) to turn on accounts that save your memory and sync across devices.</p>`));
 }else if(user){
   ac.appendChild($(`<p style="font-size:13px;margin-top:10px">Signed in${user.email?' as <strong>'+user.email+'</strong>':''}. Your profile, journal, and what Anchor has learned sync across your devices.</p>`));
   if(lockedBlob){
     ac.appendChild($(`<p class="dim" style="font-size:13px;margin-top:12px">Your private writing is locked. Enter your passphrase to unlock it on this device.</p>`));
     const pi=$(`<input type="password" placeholder="passphrase" style="margin-top:10px">`);
     const pm=$(`<div class="savedtag" style="margin-top:8px"></div>`);
     const pb=$(`<button class="btn" style="margin-top:10px">Unlock</button>`);
     pb.onclick=async()=>{if(await unlockWith(pi.value)){render();}else{pm.textContent="Wrong passphrase.";pm.classList.add('on');}};
     ac.appendChild(pi);ac.appendChild(pb);ac.appendChild(pm);
   }else{
     const pw=$(`<details style="margin-top:14px"><summary>Private-writing passphrase</summary></details>`);
     if(passphrase){
       pw.appendChild($(`<p class="dim" style="font-size:12px;margin-top:10px">On. Your journal, values and goal are encrypted with your passphrase before they sync, so not even the server can read them. If you lose the passphrase, that writing can't be recovered.</p>`));
       const rb=$(`<button class="btn outline" style="margin-top:10px">Turn off</button>`);
       rb.onclick=()=>{passphrase=null;userSalt=null;try{sessionStorage.removeItem('anchor_pp');}catch(e){}pushRemoteSoon();render();};
       pw.appendChild(rb);
     }else{
       pw.appendChild($(`<p class="dim" style="font-size:12px;margin-top:10px">Optional. Encrypt your journal, values and goal with a passphrase before they sync, so only you can read them. If you forget it, that writing can't be recovered.</p>`));
       const pi=$(`<input type="password" placeholder="choose a passphrase (6+ characters)" style="margin-top:10px">`);
       const pb=$(`<button class="btn" style="margin-top:10px">Turn on encryption</button>`);
       pb.onclick=()=>{if(pi.value.length>=6){setPassphrase(pi.value);render();}};
       pw.appendChild(pi);pw.appendChild(pb);
     }
     ac.appendChild(pw);
   }
   const so=$(`<button class="btn outline" style="margin-top:14px">Sign out</button>`);so.onclick=()=>signOutCloud();ac.appendChild(so);
 }else{
   ac.appendChild($(`<p class="dim" style="font-size:13px;margin-top:10px">Save your progress and pick up Anchor on another device.</p>`));
   const g=$(`<button class="btn" style="margin-top:12px">Continue with Google</button>`);
   const gmsg=$(`<div class="savedtag" style="margin-top:8px"></div>`);
   g.onclick=async()=>{g.textContent="Opening Google…";const ok=await signInGoogle();if(!ok){g.textContent="Continue with Google";gmsg.textContent="Google isn't set up yet — use email below.";gmsg.classList.add('on');}};
   ac.appendChild(g);ac.appendChild(gmsg);
   ac.appendChild($(`<p class="faint" style="font-size:11px;text-align:center;margin:12px 0 0">or</p>`));
   const ei=$(`<input type="text" placeholder="you@email.com" style="margin-top:6px">`);
   const msg=$(`<div class="savedtag" style="margin-top:8px"></div>`);
   const sb=$(`<button class="btn outline" style="margin-top:10px">Email me a sign-in link</button>`);
   sb.onclick=async()=>{const em=ei.value.trim();if(!/.+@.+\..+/.test(em)){msg.textContent="Enter a valid email.";msg.classList.add('on');return;}
     sb.textContent="Sending…";try{await signInEmail(em);msg.textContent="Check your email for the link.";msg.classList.add('on');sb.textContent="Link sent";}
     catch(e){msg.textContent="Couldn't send, try again.";msg.classList.add('on');sb.textContent="Email me a sign-in link";}};
   ac.appendChild(ei);ac.appendChild(sb);ac.appendChild(msg);
 }
 box.appendChild(ac);
 // understated resources
 const rc=$(`<div style="margin-top:28px"></div>`);
 rc.appendChild($(`<div class="eyebrow">Resources</div>`));
 const res=$(`<div class="res"></div>`);res.appendChild($(ICON.life));
 res.appendChild($(`<div style="font-size:13px" class="dim">If you need to talk to someone now, you can reach the 988 Suicide & Crisis Lifeline any time by call or text, or text HOME to 741741 for the Crisis Text Line. Anchor is a practice, not therapy or crisis support.</div>`));
 rc.appendChild(res);box.appendChild(rc);
 // theme + restart
 const foot=$(`<div style="margin-top:26px;display:flex;justify-content:space-between;align-items:center"></div>`);
 const th=$(`<button class="link">${S.theme==="dark"?"☾ Dark":S.theme==="light"?"☀ Light":"◐ Auto"}</button>`);
 th.onclick=()=>{S.theme=S.theme===""?"light":S.theme==="light"?"dark":"";save();render();};
 const rs=$(`<button class="link" style="color:var(--ink-faint)">Restart</button>`);
 rs.onclick=()=>{if(confirm("Restart onboarding? Your data stays until you delete it.")){S.onboarded=false;obStep=-1;obScratch={};save();render();}};
 foot.appendChild(th);foot.appendChild(rs);box.appendChild(foot);
 box.appendChild($(`<p class="faint" style="font-size:11px;text-align:center;margin-top:18px;letter-spacing:.1em">ANCHOR · IOTA</p>`));
 return box;
}

applyTheme();render();initCloud();
</script>
</body>
</html>
