<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anchor</title>
<meta name="description" content="A daily practice: one small, evidence-based thing to do, chosen for you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4EEE2; --bg2:#EFE7D7; --card:#FBF6EB;
    --ink:#1D1B17; --ink-dim:rgba(29,27,23,.62); --ink-faint:rgba(29,27,23,.40);
    --line:rgba(29,27,23,.13); --rust:#B35A3B; --slate:#5E7C92;
    --shadow:0 1px 2px rgba(29,27,23,.05);
  }
  :root[data-theme="dark"]{
    --bg:#151310; --bg2:#1A1713; --card:#1E1B16;
    --ink:#ECE4D4; --ink-dim:rgba(236,228,212,.60); --ink-faint:rgba(236,228,212,.38);
    --line:rgba(236,228,212,.13); --rust:#CB7A5C; --slate:#86A3B8;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#151310; --bg2:#1A1713; --card:#1E1B16;
    --ink:#ECE4D4; --ink-dim:rgba(236,228,212,.60); --ink-faint:rgba(236,228,212,.38);
    --line:rgba(236,228,212,.13); --rust:#CB7A5C; --slate:#86A3B8;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);}
  body{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14.5px;line-height:1.62;
       -webkit-font-smoothing:antialiased;display:flex;justify-content:center;}
  #app{width:100%;max-width:470px;min-height:100vh;display:flex;flex-direction:column;}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:500;line-height:1.08;margin:0;letter-spacing:-.01em;}
  h1{font-size:44px;} h2{font-size:30px;} h3{font-size:21px;}
  .serif{font-family:"Fraunces",Georgia,serif;}
  .eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;}
  .dim{color:var(--ink-dim);} .faint{color:var(--ink-faint);}
  .rust{color:var(--rust);}
  .wrap{padding:8px 22px 120px;flex:1;}
  .center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:34px 26px;}
  button{font-family:inherit;font-size:13px;cursor:pointer;border:none;background:none;color:inherit;}
  .btn{display:block;width:100%;background:var(--ink);color:var(--bg);padding:15px;letter-spacing:.14em;
       text-transform:uppercase;font-weight:500;font-size:12px;border-radius:3px;margin-top:12px;transition:opacity .15s;}
  .btn:active{opacity:.8;}
  .btn.outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .link{color:var(--rust);cursor:pointer;font-size:12px;letter-spacing:.06em;}
  .link.uc{text-transform:uppercase;letter-spacing:.14em;font-size:11px;}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);
       background:var(--card);border-radius:4px;padding:15px 16px;margin-top:10px;transition:border-color .12s;}
  .opt.on{border-color:var(--ink);} .opt .box{width:15px;height:15px;border:1.5px solid var(--ink-faint);border-radius:3px;flex:none;margin-top:3px;}
  .opt.round .box{border-radius:50%;} .opt.on .box{background:var(--ink);border-color:var(--ink);}
  input[type=text],input[type=password],input[type=email],textarea{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:transparent;
       border:none;border-bottom:1px solid var(--ink-faint);padding:9px 2px;outline:none;}
  textarea{resize:none;border:1px solid var(--line);border-radius:4px;background:var(--card);padding:12px;line-height:1.6;}
  input::placeholder,textarea::placeholder{color:var(--ink-faint);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px;margin-top:16px;box-shadow:var(--shadow);}
  .rule{height:1px;background:var(--line);margin:18px 0;}
  .chip{display:inline-flex;font-size:12px;border:1px solid var(--line);border-radius:30px;padding:7px 14px;margin:6px 7px 0 0;background:transparent;color:var(--ink);}
  .chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg);}
  .q{font-size:10px;width:16px;height:16px;border:1px solid var(--ink-faint);border-radius:50%;color:var(--ink-faint);
     display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:6px;cursor:pointer;padding:0;}
  .q:active{background:var(--ink);color:var(--bg);}
  .qexp{font-size:12px;color:var(--ink-dim);border-left:2px solid var(--rust);padding-left:11px;margin-top:9px;line-height:1.5;}
  .savedtag{font-size:10.5px;color:var(--slate);letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:opacity .25s;}
  .savedtag.on{opacity:1;}
  input[type=range]{width:100%;margin:12px 0 4px;accent-color:var(--slate);}
  /* top bar + bubbles */
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 6px;}
  .brand{display:flex;align-items:center;gap:9px;cursor:pointer;}
  .brand img{height:26px;width:auto;}
  .bubbles{display:flex;gap:10px;}
  .bub{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;
       justify-content:center;position:relative;color:var(--ink-dim);background:transparent;}
  .bub.on{border-color:var(--rust);color:var(--rust);}
  .bub svg{width:17px;height:17px;}
  .bub .dot{position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-radius:50%;background:var(--rust);border:1.5px solid var(--bg);}
  .dateh{margin:12px 0 4px;}
  .quote{font-style:italic;color:var(--ink-dim);font-size:13px;margin-top:10px;}
  details{margin-top:14px;} summary{cursor:pointer;color:var(--rust);font-size:12px;letter-spacing:.06em;list-style:none;text-transform:uppercase;}
  summary::-webkit-details-marker{display:none;} summary:after{content:" →";}
  details[open] summary:after{content:" ↑";}
  .alt{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;text-align:center;padding:4px;}
  .alt svg{width:20px;height:20px;color:var(--ink-dim);} .altwrap{display:flex;border-top:1px solid var(--line);margin-top:18px;padding-top:16px;}
  .altwrap .alt + .alt{border-left:1px solid var(--line);}
  .libitem{border-top:1px solid var(--line);padding:13px 0;}
  .count{font-size:11px;color:var(--ink-faint);letter-spacing:.04em;}
  .res{display:flex;gap:12px;align-items:flex-start;margin-top:12px;}
  .res svg{width:20px;height:20px;color:var(--rust);flex:none;margin-top:2px;}
  .jrow{border-top:1px solid var(--line);padding:12px 0;font-size:13px;}
  a{color:var(--rust);}
</style>
</head>

<script>window.ANCHOR_CONTENT={"anchors": [{"id": "ANC-0042", "dim": "EMOTIONAL", "priority": true, "name": "Three-line evening review", "min": 7, "type": "Anchor", "instruction": "Before bed, write one sentence each: what felt meaningful, what felt difficult, what did you learn. Then name one thing to repair or rehearse tomorrow.", "learnMore": "Keep each answer short and write longhand in a journal or on a piece of paper.", "makeEasier": "Write one sentence about your day and one thing you want to do differently tomorrow.", "safety": "Use review for learning, not punishment. Do not turn it into a score.", "evidence": "Seneca, On Anger, Book III, §36", "link": "", "wk": {"title": "Review the day, don't prosecute it", "editorial": "Seneca described ending the day by reviewing his conduct: what he had done, what needed correction, and where he had improved. The useful part is not self-judgment; a short review turns experience into a next move.", "source": "Seneca, On Anger, Book III, §36"}, "pillar": "PEACE", "modes": ["make", "learn"]}, {"id": "ANC-0312", "dim": "EMOTIONAL", "priority": false, "name": "Five-minute gratitude journal", "min": 5, "type": "Anchor", "instruction": "Write three specific things from today that you are grateful for. After each one, add a few words about why it mattered.", "learnMore": "Specific beats impressive. “Coffee” becomes “my roommate made coffee when I was running late.” A rough day still counts; gratitude is allowed to be small.", "makeEasier": "Write one good thing from today and why it mattered.", "safety": "Do not use gratitude to argue with grief, anger, or a problem that needs action. It is attention, not forced positivity.", "evidence": "Emmons & McCullough (2003), Journal of Personality and Social Psychology: randomized gratitude-listing studies", "link": "", "wk": {"title": "Good things become invisible", "editorial": "Good things often disappear from attention once they become familiar. Gratitude exercises deliberately put them back in view. In randomized studies, people assigned to regularly list things they were grateful for showed better wellbeing than comparison groups.", "source": "Emmons & McCullough (2003), Journal of Personality and Social Psychology: randomized gratitude-listing studies"}, "pillar": "PEACE", "modes": ["make"]}, {"id": "ANC-0313", "dim": "EMOTIONAL", "priority": false, "name": "Three believable affirmations", "min": 5, "type": "Anchor", "instruction": "Write three short statements you can honestly believe and act from today. Examples: “I can be nervous and still try.” “I can start before I feel ready.” “I have handled hard days before.” Read them once out loud.", "learnMore": "If a sentence feels fake, shrink it until it becomes true. Avoid grand claims like “I am unstoppable.” A useful affirmation gives you footing; it does not demand that you feel amazing.", "makeEasier": "Write one believable sentence and one action that would support it.", "safety": "If the exercise increases self-criticism, stop and choose another Anchor. Avoid statements that deny real limits, danger, or needed support.", "evidence": "Wood, Perunovic & Lee (2009), Psychological Science: experiments on positive self-statements", "link": "", "wk": {"title": "Your brain has to believe it", "editorial": "Telling yourself something wildly positive does not automatically make you feel better. In experiments, people with lower self-esteem sometimes felt worse after repeating grand statements. A more useful statement gives you something believable to stand on.", "source": "Wood, Perunovic & Lee (2009), Psychological Science: experiments on positive self-statements"}, "pillar": "PEACE", "modes": ["make", "quiet", "learn"]}, {"id": "ANC-0007", "dim": "EMOTIONAL", "priority": false, "name": "Progressive muscle relaxation", "min": 10, "type": "Anchor", "instruction": "Starting at your feet and moving upward, gently tense one muscle group for about five seconds, then let it go for about ten. Notice the contrast before moving on.", "learnMore": "A simple order is feet → calves → thighs → hands → arms → shoulders → face/jaw. Use light-to-moderate tension; the point is noticing release, not squeezing as hard as possible.", "makeEasier": "Tense and release shoulders, hands, and jaw once.", "safety": "Skip injured or painful areas. Never use maximum force. Stop for pain or cramping.", "evidence": "Muhammad Khir et al. (2024), systematic review of progressive muscle relaxation", "link": "", "wk": {"title": "Tension is easier to notice after it leaves", "editorial": "Tension can hide in the body until you deliberately release it. A 2024 review found progressive muscle relaxation was associated with lower stress and anxiety across many studies and versions. The basic skill is simply learning the contrast between holding and letting go.", "source": "Muhammad Khir et al. (2024), systematic review of progressive muscle relaxation"}, "pillar": "PEACE", "modes": []}, {"id": "ANC-0400", "dim": "EMOTIONAL", "priority": true, "name": "Five minutes of box breathing", "min": 5, "type": "Anchor", "instruction": "Breathe in gently for four counts, hold for four, breathe out for four, hold for four. Repeat at a comfortable pace for five minutes without forcing the breath.", "learnMore": "The count is a guide, not a test. If four feels strained, use three; if holding feels uncomfortable, return to normal breathing. Keep the breath smooth and easy rather than unusually deep.", "makeEasier": "Do five comfortable cycles, then breathe normally.", "safety": "Do not do this while driving or in water. Stop and breathe normally if dizzy or lightheaded.", "evidence": "Balban et al. (2023), Cell Reports Medicine: randomized breathwork study", "link": "", "wk": {"title": "Give the breath a steady rhythm", "editorial": "A 2023 experiment found that just five minutes a day of structured breathing improved mood and reduced breathing rate over a month. Box breathing is one easy way to give the breath a steady rhythm when you want something concrete to follow.", "source": "Balban et al. (2023), Cell Reports Medicine: randomized breathwork study"}, "pillar": "PEACE", "modes": ["quiet"]}, {"id": "ANC-0009", "dim": "EMOTIONAL", "priority": true, "name": "Ten returns to one sensation", "min": 5, "type": "Anchor", "instruction": "Rest attention on one sensation: breath at the nostrils, feet on the ground, or a steady sound. When attention wanders, notice and return. Count ten noticed-and-returned repetitions; wandering is the repetition, not a mistake.", "learnMore": "You are not trying to keep the mind blank. Losing the sensation and noticing that you lost it is the moment that gives you a repetition. Pick one simple sensation and keep coming back.", "makeEasier": "Notice and return three times.", "safety": "Eyes may stay open. Stop if the practice feels disorienting.", "evidence": "Schumer et al. (2018), meta-analysis of brief mindfulness training", "link": "", "wk": {"title": "The return is the repetition", "editorial": "Mindfulness is not keeping attention perfectly still. It is noticing that attention wandered and deliberately coming back without judgment. If practiced frequently, it can improve attention and focus in your daily life.", "source": "Schumer et al. (2018), meta-analysis of brief mindfulness training"}, "pillar": "PEACE", "modes": ["quiet"]}, {"id": "ANC-0303", "dim": "EMOTIONAL", "priority": false, "name": "Write the friend version", "min": 6, "type": "Anchor", "instruction": "Think of one recent mistake. Write 4–6 sentences about it with the fairness you would use for a close friend: name what happened, what hurts, what is still true, and one next step.", "learnMore": "Imagine a friend you respect made the same mistake. You would probably tell the truth without calling them worthless. Give yourself that same combination of accuracy and fairness.", "makeEasier": "Write two fair sentences and one next step.", "safety": "Self-compassion does not erase accountability; repair can be part of the next step.", "evidence": "Breines & Chen (2012), Personality and Social Psychology Bulletin", "link": "", "wk": {"title": "Kindness and accountability can coexist", "editorial": "Being fair to yourself after a mistake does not have to mean letting yourself off the hook. Across several experiments, self-compassion after mistakes or weaknesses increased some forms of motivation to improve. The useful idea is simple: less self-attack, same responsibility.", "source": "Breines & Chen (2012), Personality and Social Psychology Bulletin"}, "pillar": "PEACE", "modes": ["make", "people", "quiet"]}, {"id": "ANC-0004", "dim": "EMOTIONAL", "priority": false, "name": "Give one ordinary thing full attention", "min": 10, "type": "Anchor", "instruction": "Choose one meal, walk, or conversation today. Keep your phone away and do only that until it ends.", "learnMore": "Choose something with a natural finish line so you do not have to monitor a timer. Put the phone out of reach if possible; the task is simply to stop splitting attention for one ordinary part of the day.", "makeEasier": "Give one ordinary thing five phone-free minutes.", "safety": "Keep urgent or caregiving communication available when necessary.", "evidence": "Killingsworth & Gilbert (2010), Science", "link": "", "wk": {"title": "Attention changes the experience", "editorial": "In a large experience-sampling study, people’s minds were somewhere else almost half the time, and mind-wandering was linked with feeling worse. That does not make every daydream bad. It is a reminder that where attention goes is foundational to the life you actually experience.", "source": "Killingsworth & Gilbert (2010), Science"}, "pillar": "PEACE", "modes": ["move", "people", "outdoors"]}, {"id": "ANC-0315", "dim": "EMOTIONAL", "priority": false, "name": "Draw for pleasure", "min": 20, "type": "Anchor", "instruction": "Choose anything (ex. a mug, shoe, hand, memory, strange shape, or nothing in particular) and draw for twenty minutes. Do not worry about finishing or showing it to anyone.", "learnMore": "If the blank page freezes you, draw the object closest to you or fill the page with lines and shapes until something appears. Bad drawings count. This is time spent making, not proving you can draw.", "makeEasier": "Doodle for five minutes.", "safety": "Use materials safely and keep private material private. Stop if the activity becomes self-punishing rather than playful.", "evidence": "Keyes et al. (2024), Frontiers in Public Health: arts/crafts and subjective wellbeing", "link": "", "wk": {"title": "Making counts even when nobody sees it", "editorial": "A 2024 study of more than 7,000 adults found that people who did arts and crafts reported slightly higher happiness, life satisfaction, and sense that life was worthwhile. The takeaway is simple: making things is foundational to a good life even when the result is private.", "source": "Keyes et al. (2024), Frontiers in Public Health: arts/crafts and subjective wellbeing"}, "pillar": "EXPRESSION", "modes": ["make"]}, {"id": "ANC-0602", "dim": "EMOTIONAL", "priority": false, "name": "Rate it, name it, end on one honest line", "min": 8, "type": "Anchor", "instruction": "At day's end: rate today 1-5, write one word for why, name one thing that actually happened (not a feeling, an event), then write one sentence that is the truest thing you could say about today.", "learnMore": "This is a compact version of a personal reflection format built from three converging findings: pairing a number with a reason produces more useful self-knowledge than a number alone, writing about what happened helps organize a scattered day into something coherent, and the closing line is where people tend to say the thing they were avoiding all day. Employees at a call center who spent 15 minutes reflecting like this at day's end outperformed a control group by a meaningful margin within two weeks.", "makeEasier": "Skip straight to the one honest line.", "safety": "Use this for learning, not self-judgment. If the honest line turns punishing rather than clarifying, stop and choose a different Anchor.", "evidence": "Di Stefano, Gino, Pisano & Staats (2014), Harvard Business School Working Paper 14-093; Pennebaker & Beall (1986), Journal of Abnormal Psychology", "link": "", "wk": null, "pillar": "PEACE", "modes": ["make"]}, {"id": "ANC-0609", "dim": "EMOTIONAL", "priority": false, "name": "Five minutes of free writing", "min": 5, "type": "Anchor", "instruction": "Set a timer for five minutes and write without stopping, editing, or worrying about whether it makes sense. Follow whatever comes up. Throw it away or keep it, your choice.", "learnMore": "Unstructured expressive writing, letting thought follow its own path rather than organizing it in advance, shows measurable benefits for mood and stress across a large body of studies, and the benefit does not depend on the writing being good, organized, or shown to anyone.", "makeEasier": "Two minutes instead of five.", "safety": "If free writing surfaces something distressing and heavy, that is worth bringing to a real person, not just the page.", "evidence": "Baikie & Wilhelm (2005), Advances in Psychiatric Treatment, review of expressive writing research", "link": "", "wk": null, "pillar": "EXPRESSION", "modes": ["make"]}, {"id": "ANC-0045", "dim": "ENVIRONMENTAL", "priority": false, "name": "Find a new sitting spot", "min": 20, "type": "Anchor", "instruction": "Walk until you find a place you have never stopped before. Sit there for ten minutes with your phone away and notice what changes.", "learnMore": "New to you is enough: a shaded bench, courtyard, patch of grass, waterfront edge, library steps, or quiet campus corner. You are not searching for the perfect spot; you are interrupting autopilot.", "makeEasier": "Find a nearby place you have not sat before and stay for three phone-free minutes.", "safety": "Use safe public areas, daylight when appropriate, and normal situational awareness.", "evidence": "Meredith et al. (2020), Frontiers in Psychology: scoping review of time in nature for college-aged students", "link": "", "wk": {"title": "Ten minutes outside can be enough to notice a difference", "editorial": "A review of studies in college-aged people found that even short periods sitting or walking in natural settings were linked with better stress and wellbeing markers than urban comparison settings. The useful idea is to actually stop somewhere, not just pass through.", "source": "Meredith et al. (2020), Frontiers in Psychology: scoping review of time in nature for college-aged students"}, "pillar": "PEACE", "modes": ["move", "quiet", "outdoors"]}, {"id": "ANC-0520", "dim": "ENVIRONMENTAL", "priority": false, "name": "An hour somewhere green", "min": 60, "type": "Anchor", "instruction": "Walk for an hour somewhere with trees, grass, or water rather than traffic. No headphones, no destination.", "learnMore": "In a controlled experiment, people who walked ninety minutes in a natural setting afterwards reported less rumination (the looping self-critical thought) and showed reduced activity in a brain region associated with it. People who walked the same length of time beside a busy road did not. The setting was doing the work, not the walking.", "makeEasier": "Take twenty minutes somewhere green.", "safety": "Choose a safe route in daylight and keep normal situational awareness. Adapt for mobility and weather.", "evidence": "Bratman, Hamilton, Hahn, Daily & Gross (2015), PNAS 112(28):8567–8572", "link": "", "wk": {"title": "The setting is doing the work", "editorial": "Participants walked ninety minutes either through grassland or alongside a busy road. The nature group afterwards reported less rumination and showed reduced activity in the subgenual prefrontal cortex, a region associated with it. The urban group did not, despite walking the same length of time. Same exercise, different result.", "source": "Bratman, Hamilton, Hahn, Daily & Gross (2015), PNAS 112(28):8567–8572"}, "pillar": "STABILITY", "modes": ["move", "outdoors"]}, {"id": "ANC-0521", "dim": "ENVIRONMENTAL", "priority": false, "name": "Clear the first thing you see", "min": 15, "type": "Anchor", "instruction": "Deal with the one surface you look at first when you walk into the room you spend most time in. Fifteen minutes, then stop.", "learnMore": "In a study of dual-income couples, the people whose spontaneous descriptions of home leaned on words about clutter and unfinished projects also showed flatter daily cortisol patterns and more depressed mood across the day. It is a correlation, not a cure: but how the space reads to you is not nothing.", "makeEasier": "Clear one surface, or even one corner of it.", "safety": "This is one surface, not a renovation. Adapt for shared housing, disability, and living situations you do not control.", "evidence": "Saxbe & Repetti (2010), Personality and Social Psychology Bulletin 36(1):71–81", "link": "", "wk": {"title": "How the room reads to you is data", "editorial": "In a study of 60 dual-income spouses, researchers analysed the words people used on a self-guided tour of their own home. Those whose descriptions leaned on clutter and unfinished projects showed flatter daily cortisol slopes and more depressed mood across the day; those describing restful, natural qualities showed the opposite. The link held after controlling for marital satisfaction and neuroticism. It is correlational: but the description was doing the predicting.", "source": "Saxbe & Repetti (2010), Personality and Social Psychology Bulletin 36(1):71–81"}, "pillar": "STABILITY", "modes": ["move", "outdoors"]}, {"id": "ANC-0522", "dim": "ENVIRONMENTAL", "priority": true, "name": "Put it where you will trip over it", "min": 10, "type": "Anchor", "instruction": "Take one thing you keep meaning to do and move the object it needs into your path: running shoes by the door, the book on the pillow, the guitar out of its case.", "learnMore": "A large share of everyday behavior is triggered by context rather than chosen fresh each time. That cuts both ways, which is the useful part: if the cue is doing the deciding, moving the cue is more reliable than deciding harder.", "makeEasier": "Move one object.", "safety": "No special safety concerns. Do not create a trip hazard in a shared space.", "evidence": "Wood & Rünger (2016), Annual Review of Psychology. Psychology of Habit", "link": "", "wk": {"title": "Change the cue, not the willpower", "editorial": "A great deal of repeated behavior is triggered by context rather than decided fresh. That is usually described as a problem, but it is symmetrical: if the environment is doing the deciding, then editing the environment is the lever, and it does not run out the way effort does.", "source": "Wood & Rünger (2016), Annual Review of Psychology. Psychology of Habit"}, "pillar": "PEACE", "modes": ["move"]}, {"id": "ANC-0523", "dim": "ENVIRONMENTAL", "priority": false, "name": "One thing that is not about you", "min": 20, "type": "Anchor", "instruction": "Do one thing today whose benefit lands outside your own life: pick up what is not yours, sort the recycling properly, walk instead of ordering the ride, sign up for the cleanup.", "learnMore": "Across 78 studies, people who act on environmental concern report modestly higher wellbeing, and the association is strongest for the actions that feel meaningful and for the warm-glow sense of having done something. The size is modest and the direction of causation is not settled: but the effect is not zero and it is not about the size of the act.", "makeEasier": "Do the smallest version within arm's reach.", "safety": "Keep it proportionate. This is not a reason to take on guilt for systemic problems.", "evidence": "Johnson-Zawadzki, Steg & Bouman (2020), Environmental Research Letters 15(12):123007", "link": "", "wk": {"title": "Small acts, real but modest", "editorial": "A meta-analysis of 78 studies found a positive association between people's pro-environmental behaviour and their subjective wellbeing (overall r = .243), strongest for actions carrying obvious meaning and for the warm-glow sense of having done something worthwhile. The relationship held across samples and designs. It is an association, and a modest one: which is the honest size to claim.", "source": "Johnson-Zawadzki, Steg & Bouman (2020), Environmental Research Letters 15(12):123007"}, "pillar": "STABILITY", "modes": ["move", "outdoors"]}, {"id": "ANC-0606", "dim": "ENVIRONMENTAL", "priority": false, "name": "Ten minutes of digital decluttering", "min": 10, "type": "Anchor", "instruction": "Spend ten minutes unsubscribing from, muting, or deleting digital clutter you do not need: email lists, app notifications, unused subscriptions, old group chats.", "learnMore": "The mere presence of a phone, even face-down and silent, measurably reduces the cognitive capacity available for a task, and the effect is worst for people who rely on their phone most. Reducing what is competing for your attention is an environmental change, not a willpower exercise.", "makeEasier": "Unsubscribe from or mute three things instead of ten.", "safety": "No special safety concerns. Do not unsubscribe from anything time-sensitive (financial aid, health, or academic notices) without checking first.", "evidence": "Ward, Duke, Gneezy & Bos (2017), Journal of the Association for Consumer Research", "link": "", "wk": null, "pillar": "STABILITY", "modes": []}, {"id": "ANC-0501", "dim": "FINANCIAL", "priority": false, "name": "Spend a small amount on someone else", "min": 15, "type": "Anchor", "instruction": "Take a small amount you would have spent on yourself today and spend it on someone else instead: coffee, a book you know they want, a donation in their name.", "learnMore": "The doing is the part that matters. In a large registered replication, people who actually spent money on someone else were measurably happier afterward, while people who merely recalled having done so showed close to nothing. Reflection did not substitute for the act.", "makeEasier": "Buy one person the cheapest real thing you can think of.", "safety": "Spend only what you can afford to lose. Generosity that creates financial strain is not the point.", "evidence": "Aknin, Dunn, Proulx, Lok & Norton (2020), Journal of Personality and Social Psychology 119(2): registered replication report", "link": "", "wk": {"title": "Doing it beats remembering it", "editorial": "A registered replication with 7,861 participants across three experiments found that people who actually spent money on someone else were happier than those who spent on themselves (d = .36), while simply recalling a past act of generosity produced almost nothing (d = .03 and .06). The authors concluded there is no single effect size here: engagement is what separates the versions that work from the ones that do not.", "source": "Aknin, Dunn, Proulx, Lok & Norton (2020), Journal of Personality and Social Psychology 119(2): registered replication report"}, "pillar": "STABILITY", "modes": ["people"]}, {"id": "ANC-0503", "dim": "FINANCIAL", "priority": true, "name": "Buy the doing, not the having", "min": 10, "type": "Anchor", "instruction": "If you are going to spend money on something optional this week, put it toward something you will do rather than something you will own.", "learnMore": "The research here points in a direction rather than settling a number: experiences tend to be recalled more fondly than possessions, partly because they resist comparison and become part of the story you tell about yourself. Treat it as a tiebreaker when you are genuinely torn, not a rule.", "makeEasier": "Name one experience you would spend the same money on.", "safety": "This applies to discretionary spending only. Nothing here is financial advice.", "evidence": "Van Boven & Gilovich (2003), Journal of Personality and Social Psychology 85(6):1193–1202; see also Gilovich & Kumar (2020) review", "link": "", "wk": {"title": "Experiences resist comparison", "editorial": "The finding that experiential purchases tend to be recalled more fondly than material ones is an established direction in consumer psychology rather than a settled magnitude, and later work has mapped conditions where it does not hold. The plausible mechanism is that an experience becomes part of your story and is harder to line up against what other people bought. Use it as a tiebreaker, not a rule.", "source": "Van Boven & Gilovich (2003), Journal of Personality and Social Psychology 85(6):1193–1202; see also Gilovich & Kumar (2020) review"}, "pillar": "STABILITY", "modes": []}, {"id": "ANC-0504", "dim": "FINANCIAL", "priority": false, "name": "Move the saving before you can spend it", "min": 10, "type": "Anchor", "instruction": "Move a small amount into savings the day money arrives, automatically if your bank allows it. Small enough that you will not reverse it.", "learnMore": "The classic demonstration of this idea raised participants' savings rates from about 3.5% to 13.6% over roughly three years, mostly by removing the decision rather than by persuading anyone. Timing does the work: money that never lands in the spending account is not money you have to resist.", "makeEasier": "Move any amount once, by hand.", "safety": "Only automate what you can spare. An overdraft caused by an automatic transfer is a worse outcome than not saving this month.", "evidence": "Benartzi & Thaler (2004), Journal of Political Economy 112(S1). Save More Tomorrow", "link": "", "wk": {"title": "Remove the decision, not the temptation", "editorial": "The best-known demonstration of automatic saving raised participants' savings rates from about 3.5% to 13.6% over roughly forty months. Almost none of that came from persuading people that saving matters. It came from committing in advance and letting the transfer happen without a fresh decision each month.", "source": "Benartzi & Thaler (2004), Journal of Political Economy 112(S1). Save More Tomorrow"}, "pillar": "STABILITY", "modes": ["move"]}, {"id": "ANC-0600", "dim": "FINANCIAL", "priority": false, "name": "Do the 100-minus-your-age math", "min": 15, "type": "Anchor", "instruction": "Subtract your age from 100. That is a common rule-of-thumb starting point for the share of a long-term portfolio held in stocks versus bonds. Work out your own number, then look at one concrete next step: a single low-cost, broad-market ETF (like VOO), through the Money Management Program, a campus workshop, or a beginner guide like investor.gov.", "learnMore": "This is not personalized financial advice, and the rule itself is debated. Younger investors sometimes use a higher number (a '110' or '120 minus age' version) since a longer time horizon can support more risk; the point of the exercise is starting the math, not locking in a formula for life. If you have any actual balance to invest, a fee-free index fund is the standard beginner starting point most guides converge on.", "makeEasier": "Just do the subtraction and write down the one number. Skip the ETF step for now.", "safety": "Not financial advice. Do not invest money you may need in the next few years, and confirm anything with a real source, such as the Money Management Program, before acting.", "evidence": "Investor.gov (SEC); justETF and Kiplinger explainers of the 100-minus-age heuristic", "link": "", "wk": null, "pillar": "STABILITY", "modes": []}, {"id": "ANC-0308", "dim": "INTELLECTUAL", "priority": false, "name": "Put tomorrow on paper", "min": 5, "type": "Anchor", "instruction": "At bedtime, spend five minutes writing the specific tasks you need to remember over the next few days. Do not solve them. When the timer ends, put the list away.", "learnMore": "Capture concrete reminders. For example, “email professor about Friday” is better than “fix school.” If your mind tries to solve the list, write the next step and move on. The point is storage, not productivity.", "makeEasier": "Write the three tasks you most need to remember.", "safety": "If writing increases distress, stop. This is not a substitute for care for persistent sleep problems.", "evidence": "Scullin et al. (2018), Journal of Experimental Psychology: General", "link": "", "wk": {"title": "Put tomorrow on paper", "editorial": "Bedtime is a bad place to store unfinished tasks. In a sleep-lab study of 57 healthy young adults, people who spent five minutes writing a specific future to-do list fell asleep faster than people who wrote about completed tasks. Put tomorrow somewhere other than your head.", "source": "Scullin et al. (2018), Journal of Experimental Psychology: General"}, "pillar": "STABILITY", "modes": []}, {"id": "ANC-0311", "dim": "INTELLECTUAL", "priority": false, "name": "Fifty words, no E", "min": 12, "type": "Anchor", "instruction": "Write exactly fifty words about something that happened today without using the letter E.", "learnMore": "Draft first, then hunt down every E. Proper grammar is optional; strange substitutions are part of the game. The goal is not good writing, it is solving a tiny creative constraint.", "makeEasier": "Write fifteen words with no E.", "safety": "No special safety concerns beyond ordinary writing and privacy choices.", "evidence": "Oulipo / Georges Perec: lipogram provenance", "link": "", "wk": {"title": "Constraint can be the assignment", "editorial": "Artists and writers often use constraints because a blank page can be too open. The Oulipo group built whole works around arbitrary rules, including writing without the letter E. Slight restriction can sometimes make creativity easier to channel.", "source": "Oulipo / Georges Perec: lipogram provenance"}, "pillar": "EXPRESSION", "modes": ["make"]}, {"id": "ANC-0541", "dim": "INTELLECTUAL", "priority": false, "name": "Come back to it tomorrow", "min": 10, "type": "Anchor", "instruction": "Take something you studied recently and schedule ten minutes on it tomorrow or the day after, instead of doing another block on it now.", "learnMore": "Spreading study out beats packing it together: across hundreds of experiments the spaced version came out roughly ten percentage points ahead. The gap should scale with how long you need to keep it: days for a test next month, longer for something you want to still have next year.", "makeEasier": "Put ten minutes in your calendar for tomorrow.", "safety": "No special safety concerns.", "evidence": "Cepeda, Pashler, Vul, Wixted & Rohrer (2006), Psychological Bulletin 132(3):354–380", "link": "", "wk": {"title": "The gap should match the horizon", "editorial": "Across 839 assessments in 317 experiments, spacing study sessions out beat packing them together: about 47% versus 37% recalled. The practical detail is that the best gap scales with how long you need to keep the material: short gaps for a test in days, gaps of a month or more when you want it in six.", "source": "Cepeda, Pashler, Vul, Wixted & Rohrer (2006), Psychological Bulletin 132(3):354–380"}, "pillar": "STABILITY", "modes": []}, {"id": "ANC-0542", "dim": "INTELLECTUAL", "priority": false, "name": "Explain it to the empty room", "min": 12, "type": "Anchor", "instruction": "Take one idea you half-understand and explain it out loud, to nobody, as if to someone who has never heard of it. Notice the sentence where you stall.", "learnMore": "Prompting yourself to explain while you learn has a solid, medium-sized effect across dozens of studies. The mechanism is unglamorous: explaining exposes the joins you had been skating over. The stall is the finding, not the failure.", "makeEasier": "Explain one sentence of it out loud.", "safety": "No special safety concerns beyond ordinary privacy about what you are studying.", "evidence": "Bisra, Liu, Nesbit, Salimi & Winne (2018), Educational Psychology Review 30(3):703–725", "link": "", "wk": {"title": "The stall is the finding", "editorial": "Prompting yourself to explain material while learning it produced a medium effect across 69 effect sizes from 64 studies (g = .55), holding across subjects and education levels. Explaining forces you to build the joins you were skating over: which is why the sentence where you stall is the most useful thing the exercise gives you.", "source": "Bisra, Liu, Nesbit, Salimi & Winne (2018), Educational Psychology Review 30(3):703–725"}, "pillar": "PEACE", "modes": ["people", "learn"]}, {"id": "ANC-0225", "dim": "INTELLECTUAL", "priority": false, "name": "One small new thing", "min": 10, "type": "Anchor", "instruction": "Do one small thing you have not done before today: a new route, a new dish, a new song genre, a new seat in a familiar room. Notice what you observe about yourself while doing it.", "learnMore": "New to you is what counts, not impressive. A different route to a class, a food you have never ordered, or a seat you have never taken in a familiar room all qualify.", "makeEasier": "Change one small default (route, order, seat) and notice it, nothing more.", "safety": "Keep novelty low-risk and within your comfort and safety.", "evidence": "Buchanan & Bardi (2010), Journal of Social Psychology: acts of novelty and kindness", "link": "", "wk": {"title": "Novelty can be small", "editorial": "Novelty does not have to mean a huge adventure. In an experiment, people assigned small daily acts of novelty or kindness for ten days reported increased life satisfaction compared with a control group.", "source": "Buchanan & Bardi (2010), Journal of Social Psychology: acts of novelty and kindness"}, "pillar": "PEACE", "modes": []}, {"id": "ANC-0401", "dim": "OCCUPATIONAL", "priority": false, "name": "Twenty-five minutes, one thing", "min": 25, "type": "Anchor", "instruction": "Pick the school or work task you are most likely to keep avoiding. Put your phone out of reach, set 25 minutes, and work only on that task until the timer ends.", "learnMore": "Do not use the block to organize the work. Open the document, problem set, reading, or email and begin the actual task. When the timer ends, you can stop or keep going.", "makeEasier": "Work on the task for five minutes with your phone out of reach.", "safety": "Keep urgent or caregiving communication available when necessary.", "evidence": "Rubinstein, Meyer & Evans (2001), Journal of Experimental Psychology: Human Perception and Performance, task-switching costs", "link": "", "wk": null, "pillar": "STABILITY", "modes": []}, {"id": "ANC-0511", "dim": "OCCUPATIONAL", "priority": false, "name": "End the day on purpose", "min": 10, "type": "Anchor", "instruction": "Choose a time tonight when work stops. Close the tabs, put the laptop somewhere else, and write the one thing you will pick up first tomorrow so you can stop holding it.", "learnMore": "Detachment is a specific thing: not thinking about work during non-work time, which is different from not doing work. Across a large body of studies it tracks with lower exhaustion and fatigue and better sleep and life satisfaction. A written handover to tomorrow is what makes stopping possible.", "makeEasier": "Write the one thing you will pick up first tomorrow.", "safety": "Adapt for shift work, caregiving, and jobs with genuine on-call obligations.", "evidence": "Wendsche & Lohmann-Haislah (2017), Frontiers in Psychology 7:2072: meta-analysis of detachment from work", "link": "", "wk": {"title": "Stopping is a separate skill from finishing", "editorial": "Psychological detachment (not thinking about work during non-work time) was pooled across 91 samples and about 38,000 employees. It tracked with lower fatigue and exhaustion and with better sleep quality, general wellbeing and life satisfaction. Notably, doing work-related things during off hours was one of the strongest things working against it.", "source": "Wendsche & Lohmann-Haislah (2017), Frontiers in Psychology 7:2072: meta-analysis of detachment from work"}, "pillar": "PEACE", "modes": ["make"]}, {"id": "ANC-0607", "dim": "OCCUPATIONAL", "priority": true, "name": "Draw your own ikigai", "min": 15, "type": "Anchor", "instruction": "Draw four overlapping circles: what you love, what you are good at, what the world needs, what you could be paid for. Write two or three things in each. Look at what lands in more than one circle.", "learnMore": "The four-circle diagram is a popular Western tool inspired by ikigai, not the traditional Japanese concept itself, which is broader and less career-centered than the diagram suggests. Used honestly as a prompt rather than a verdict, a stronger sense of ikigai is associated with better wellbeing and lower depression in the research that exists so far, including in Western samples.", "makeEasier": "Fill in just one circle today.", "safety": "This is a reflective exercise, not a career decision. An empty or messy diagram is a normal result, not a problem to solve today.", "evidence": "Kotera & Fido (2021), Ikigai: Towards a psychological understanding of a life worth living; a 2022 study in the International Journal of Mental Health and Addiction linking ikigai to wellbeing and lower depression", "link": "", "wk": null, "pillar": "EXPRESSION", "modes": ["make"]}, {"id": "ANC-0314", "dim": "PHYSICAL", "priority": true, "name": "Mindfulness walk", "min": 12, "type": "Anchor", "instruction": "Take a 10–12 minute walk with no headphones. Walk at a normal pace and keep returning attention to what you can feel, hear, and see right now.", "learnMore": "Do not try to make the walk profound. Feel your feet, notice the temperature, hear one sound, see one color. When your mind leaves the walk, gently return to one sense.", "makeEasier": "Walk outside for three minutes and name three things you see and three things you hear.", "safety": "Choose a safe route, keep normal situational awareness, and adapt for mobility or weather.", "evidence": "Ma et al. (2022), Explore: randomized mindful-walking study in university students", "link": "", "wk": {"title": "Walk and come back to now", "editorial": "Mindful walking combines two simple things: movement and deliberately returning attention to what is happening now. In a randomized study of university students, a week of mindful walking improved mindfulness, mood, and sleep. Their walks were longer than this one, so treat ten minutes as practice.", "source": "Ma et al. (2022), Explore: randomized mindful-walking study in university students"}, "pillar": "PEACE", "modes": ["move", "outdoors"]}, {"id": "ANC-0090", "dim": "PHYSICAL", "priority": true, "name": "Morning light before scrolling", "min": 10, "type": "Anchor", "instruction": "Before using social media or a screened device in the morning, spend ten minutes outside in daylight.", "learnMore": "You do not need to stare at the sky or sun. Sit, walk, drink coffee, or just stand outside. Outdoor daylight is much brighter than typical indoor light, even on many cloudy mornings.", "makeEasier": "Step outside for three minutes before scrolling.", "safety": "Use normal sun safety. Do not stare at the sun.", "evidence": "Duffy & Czeisler (2009), Sleep Medicine Clinics", "link": "", "wk": {"title": "Light is a clock signal", "editorial": "Light is one of the main signals that shifts the human circadian clock. Its effect depends on timing, intensity, duration, and wavelength, which is why there is no universal dose. Outdoor morning light is a practical ritual built from a strong mechanism: give the clock a clear daytime signal before adding more input.", "source": "Duffy & Czeisler (2009), Sleep Medicine Clinics"}, "pillar": "STABILITY", "modes": ["outdoors"]}, {"id": "ANC-0087", "dim": "PHYSICAL", "priority": false, "name": "Bed is for sleep tonight", "min": 5, "type": "Anchor", "instruction": "Remove one wakeful activity from bed tonight (ex. scrolling, television, studying, or extended texting). Put what it needs somewhere else before you get in.", "learnMore": "Do not redesign your whole night. Pick the one thing that most keeps you awake and give it another home: desk for studying, couch for shows, charger across the room for the phone.", "makeEasier": "Move only the phone out of reach of the bed.", "safety": "Adapt for disability, housing, caregiving, and medical needs.", "evidence": "Jansson-Fröjmark et al. (2024), systematic review/meta-analysis of stimulus control for insomnia", "link": "", "wk": {"title": "Your bed learns", "editorial": "Sleep researchers use a simple idea called stimulus control: make the bed a stronger cue for sleep by moving wakeful activities elsewhere. You do not need a perfect nighttime routine. Start by taking one alerting habit out of bed.", "source": "Jansson-Fröjmark et al. (2024), systematic review/meta-analysis of stimulus control for insomnia"}, "pillar": "STABILITY", "modes": []}, {"id": "ANC-0013", "dim": "PHYSICAL", "priority": true, "name": "Fiction before sleep", "min": 15, "type": "Anchor", "instruction": "Put your phone out of reach and read a book for about fifteen minutes before sleep. Choose fiction if you have it.", "learnMore": "This is not a reading challenge. Pick something easy enough to enjoy when tired. A physical book is simplest; an e-reader is fine if it does not pull you into notifications or other apps.", "makeEasier": "Read five pages with your phone out of reach.", "safety": "Use comfortable light and stop if reading delays needed sleep.", "evidence": "Finucane et al. (2021), Trials", "link": "", "wk": {"title": "A book before bed has actually been tested", "editorial": "A randomized trial asked adults to read a book in bed before sleep for seven nights or not to read in bed. More people in the reading group later reported improved sleep quality. It was self-reported and not specific to fiction, but it gives a simple alternative to ending the night with a feed.", "source": "Finucane et al. (2021), Trials"}, "pillar": "STABILITY", "modes": ["learn"]}, {"id": "ANC-0083", "dim": "PHYSICAL", "priority": false, "name": "Three-color meal", "min": 5, "type": "Anchor", "instruction": "Build one meal with at least three naturally different colors, using foods you already eat or can reasonably access.", "learnMore": "The colors are just a quick variety cue. Think tomato + rice + greens, berries + yogurt + nuts, or beans + corn + salsa. You do not need a perfect plate or vastly unfamiliar foods.", "makeEasier": "Add one different-colored food to a meal.", "safety": "Color is a variety cue, not a nutrition score. Adapt for allergies, access, culture, and eating-disorder treatment plans.", "evidence": "Blumfield et al. (2022), umbrella review; Verger et al. (2021), dietary-diversity scoping review", "link": "", "wk": {"title": "Color is a cue, not a score", "editorial": "Different colors do not guarantee a healthy meal. Color is just a fast visual cue for variety, and dietary variety can help broaden the mix of nutrients you get. Use the rule to widen the plate.", "source": "Blumfield et al. (2022), umbrella review; Verger et al. (2021), dietary-diversity scoping review"}, "pillar": "EXPRESSION", "modes": ["make"]}, {"id": "ANC-0064", "dim": "PHYSICAL", "priority": false, "name": "Bundle one workout with one pleasure", "min": 5, "type": "Anchor", "instruction": "Choose one podcast, playlist, audiobook, or show you genuinely enjoy and reserve it exclusively for exercise sessions this week.", "learnMore": "Pick something tempting enough that you actually want it, then make access easy (ex. download the episode or queue the playlist before the workout). The bundle works only if you mostly keep the pleasure paired with movement.", "makeEasier": "Choose the pleasure you will reserve for your next workout or walk.", "safety": "Choose exercise appropriate to your ability and medical guidance.", "evidence": "Milkman, Minson & Volpp (2014), Management Science", "link": "", "wk": {"title": "Hold the audiobook hostage", "editorial": "Katherine Milkman and colleagues tested “temptation bundling” by giving gym-goers tempting audiobooks they could access only at the gym. Gym attendance increased. The practical idea is simple: let something enjoyable pull something useful along with it.", "source": "Milkman, Minson & Volpp (2014), Management Science"}, "pillar": "EXPRESSION", "modes": ["move"]}, {"id": "ANC-0409", "dim": "PHYSICAL", "priority": false, "name": "Move hard for twenty minutes", "min": 20, "type": "Anchor", "instruction": "Choose a form of exercise you already know how to do (ex. lift, run, bike, row, swim, play a sport) and move at a challenging but controlled effort for twenty minutes.", "learnMore": "This is not a fitness test. Pick something familiar, warm up as needed, and leave a little in the tank. The goal is a real bout of movement, not proving anything.", "makeEasier": "Do ten minutes at a comfortable-to-challenging effort.", "safety": "Use exercise appropriate to your ability and medical guidance. Stop for pain, chest symptoms, faintness, or unusual shortness of breath.", "evidence": "Singh, Olds, Curtis et al. (2023), British Journal of Sports Medicine, umbrella review of physical activity and depression/anxiety", "link": "", "wk": null, "pillar": "STABILITY", "modes": ["move"]}, {"id": "ANC-0410", "dim": "PHYSICAL", "priority": false, "name": "Make one real meal", "min": 25, "type": "Anchor", "instruction": "Make one simple meal from actual ingredients you have access to. Include a protein source, a carbohydrate or starch, and at least one fruit or vegetable.", "learnMore": "Keep it basic: eggs and toast with fruit, rice and beans with salsa, chicken and vegetables, pasta with a protein, or another normal meal you already know how to make.", "makeEasier": "Assemble the simplest balanced meal you can with what is available.", "safety": "Adapt for allergies, food access, culture, medical needs, and eating-disorder treatment plans.", "evidence": "Wolfson & Bleich (2015), Public Health Nutrition, cooking frequency and diet quality", "link": "", "wk": null, "pillar": "EXPRESSION", "modes": ["make"]}, {"id": "ANC-0403", "dim": "PHYSICAL", "priority": false, "name": "Decide before the first drink", "min": 2, "type": "Anchor", "instruction": "If you plan to drink tonight, decide your limit before the first drink.", "learnMore": "Keep it private if you want. The point is simply to move one decision earlier. If you are not drinking tonight, choose another Anchor.", "makeEasier": "Write one sentence about what you want tonight to look like.", "safety": "Never drive after drinking. Alcohol can interact dangerously with medications and other drugs. Skip this Anchor if alcohol is not part of your plans.", "evidence": "National Institute on Alcohol Abuse and Alcoholism (NIAAA), Rethinking Drinking: planning and strategies", "link": "", "wk": {"title": "Move the decision earlier", "editorial": "Alcohol makes later decisions less reliable. If drinking is part of the night, setting a goal before the first drink moves the decision to a point when judgment is clearer. NIAAA recommends setting drinking goals and planning strategies in advance.", "source": "National Institute on Alcohol Abuse and Alcoholism (NIAAA), Rethinking Drinking: planning and strategies"}, "pillar": "STABILITY", "modes": []}, {"id": "ANC-0304", "dim": "SOCIAL", "priority": true, "name": "Reach out just because", "min": 2, "type": "Anchor", "instruction": "Choose someone in your social circle you have not heard from lately. Send a low-pressure message or voice note: you thought of them, you hope they are well, or one small thing reminded you of them. No request required.", "learnMore": "Keep it natural and specific. “That song we used to play came on and made me think of you” usually feels more human than a formal check-in. You do not need to turn it into a long conversation.", "makeEasier": "Send: “Thought of you today. Hope you’re doing well.”", "safety": "Do not contact someone who has asked for space or where contact would be unsafe.", "evidence": "Liu et al. (2022), Journal of Personality and Social Psychology", "link": "", "wk": {"title": "The message lands bigger than it feels", "editorial": "A two-line message can feel too small to matter. Across preregistered experiments, people systematically underestimated how much someone in their social circle would appreciate an unexpected reach-out, especially when the contact was more surprising. The research suggests these messages often land bigger than the sender expects.", "source": "Liu et al. (2022), Journal of Personality and Social Psychology"}, "pillar": "STABILITY", "modes": ["people"]}, {"id": "ANC-0146", "dim": "SOCIAL", "priority": true, "name": "Talk for one transit stop", "min": 5, "type": "Anchor", "instruction": "On a bus, shuttle, elevator, line, or waiting area, start one brief conversation with a stranger and let it end naturally.", "learnMore": "Use the situation in front of you: for example, ask whether the shuttle always runs this late, comment on the line, or say hello and ask a simple question. If the other person gives short answers or turns away, let the conversation end naturally.", "makeEasier": "Say hello and ask one situational question or give a compliment.", "safety": "Choose a safe setting and stop immediately if the other person is not interested.", "evidence": "Epley & Schroeder (2014), Journal of Experimental Psychology: General", "link": "", "wk": {"title": "Strangers are less bad than we predict", "editorial": "Nicholas Epley and Juliana Schroeder asked commuters to talk with a stranger, stay disconnected, or commute as usual. People expected conversation to be less pleasant than it actually was; those assigned to connect reported a more positive experience. Brief contact can feel better than we predict.", "source": "Epley & Schroeder (2014), Journal of Experimental Psychology: General"}, "pillar": "STABILITY", "modes": ["people"]}, {"id": "ANC-0305", "dim": "SOCIAL", "priority": false, "name": "One specific compliment", "min": 1, "type": "Anchor", "instruction": "Give one genuine compliment about a person’s choice, effort, action, or contribution. Keep it specific and expect nothing back.", "learnMore": "Aim at something the person chose or did: “You explained that really clearly” is better than a vague “you’re amazing.” Say it once, mean it, and move on.", "makeEasier": "Give one specific compliment in one sentence.", "safety": "Avoid sexualized, invasive, or body-focused comments; respect disinterest.", "evidence": "Boothby & Bohns (2021), Personality and Social Psychology Bulletin", "link": "", "wk": {"title": "Awkward for you, warmer for them", "editorial": "Compliments are strangely easy to rehearse and hard to say. Across five studies, compliment givers underestimated how positive recipients would feel and overestimated how uncomfortable they would feel. Specific, sincere warmth usually lands better than the giver expects.", "source": "Boothby & Bohns (2021), Personality and Social Psychology Bulletin"}, "pillar": "STABILITY", "modes": []}, {"id": "ANC-0157", "dim": "SOCIAL", "priority": false, "name": "Call someone older", "min": 10, "type": "Anchor", "instruction": "Call a parent, grandparent, aunt, uncle, mentor, or older family friend and ask one question: “What was life like for you at my age?” Let the conversation go where it goes.", "learnMore": "This is not an interview. One honest follow-up is enough: What did you worry about? What did you do for fun? What did you think your life would become?", "makeEasier": "Send a voice note or text asking one older person a question or giving a life update.", "safety": "Choose someone you feel safe contacting and respect boundaries, grief, privacy, and their time.", "evidence": "Liu et al. (2022), Journal of Personality and Social Psychology: unexpected reach-out studies", "link": "", "wk": {"title": "A real question gives the call somewhere to go", "editorial": "Unexpected contact is often more appreciated than senders predict. The research is not specifically about older relatives or mentors. Asking what life was like at your age simply gives the contact a real starting point and creates room for a story you would not otherwise get.", "source": "Liu et al. (2022), Journal of Personality and Social Psychology: unexpected reach-out studies"}, "pillar": "STABILITY", "modes": ["people", "learn"]}, {"id": "ANC-0551", "dim": "SOCIAL", "priority": false, "name": "Go back to the group you already have", "min": 60, "type": "Anchor", "instruction": "Show up once to a group you already belong to but have drifted from: a team, a chapter, a class, a congregation, a standing game. Attendance is the whole task.", "learnMore": "Belonging to groups tracks with markedly lower depression risk, and the protective association is strongest for people who have been depressed before. The research followed adults over 50, so the numbers do not transfer directly to a twenty-year-old: but the mechanism it points at, membership rather than headcount, is worth taking seriously.", "makeEasier": "Message one person from the group.", "safety": "Do not return to a group that is unsafe or harmful for you. Membership is not worth that.", "evidence": "Cruwys, Dingle, Haslam, Haslam, Jetten & Morton (2013), Social Science & Medicine 98:179–186", "link": "", "wk": {"title": "Membership, not headcount", "editorial": "In longitudinal data, the number of groups a person belonged to strongly predicted later depression. Among people with a history of depression, 41% of those belonging to no groups relapsed, against 15% of those belonging to three or more; joining one group was associated with 24% lower relapse risk, and three with 63%. The sample was adults over 50, so the numbers do not transfer directly to a student: but what it points at is belonging, not how many people you know.", "source": "Cruwys, Dingle, Haslam, Haslam, Jetten & Morton (2013), Social Science & Medicine 98:179–186"}, "pillar": "STABILITY", "modes": []}, {"id": "ANC-0552", "dim": "SOCIAL", "priority": false, "name": "Check the thing you assumed", "min": 10, "type": "Anchor", "instruction": "Write down one thing you believe about how a specific person sees you: they are annoyed, they have moved on, they would rather you did not come. Then write what evidence you actually have, and one ordinary explanation that fits it just as well.", "learnMore": "The most effective loneliness interventions in a meta-analysis of randomized trials were not the ones that arranged more social contact. They were the ones that addressed the thinking: the assumption of rejection that quietly makes contact unappealing before it is tried. More people is not always the answer to fewer people.", "makeEasier": "Write the belief and one alternative explanation.", "safety": "This is a thinking exercise, not a substitute for care if loneliness is persistent or heavy.", "evidence": "Masi, Chen, Hawkley & Cacioppo (2011), Personality and Social Psychology Review 15(3):219–266", "link": "", "wk": {"title": "More people is not always the answer", "editorial": "A meta-analysis compared four approaches to loneliness: teaching social skills, increasing social support, creating more opportunities for contact, and addressing maladaptive social cognition. Among randomized trials the last was clearly the most effective. The implication is uncomfortable and useful: the expectation of rejection often does more work than the absence of people.", "source": "Masi, Chen, Hawkley & Cacioppo (2011), Personality and Social Psychology Review 15(3):219–266"}, "pillar": "STABILITY", "modes": ["make", "learn"]}, {"id": "ANC-0191", "dim": "SOCIAL", "priority": false, "name": "Make someone a short playlist", "min": 10, "type": "Anchor", "instruction": "Choose one person you care about and build a five-to-ten song playlist that says something about how you see them. Send it with one line about why.", "learnMore": "A specific choice reads as attention, not production value: five deliberately chosen songs beat a generic 'thinking of you' playlist pulled from a chart.", "makeEasier": "Send one song and one line instead of a full playlist.", "safety": "Respect the other person's time and taste. Do not expect or chase a response.", "evidence": "Kumar & Epley (2023), Journal of Experimental Psychology: General: underestimating the impact of kindness", "link": "", "wk": {"title": "Small acts of care carry farther than expected", "editorial": "In experiments on everyday kindness, givers consistently underestimated how positive recipients would feel. A playlist is simply one low-cost way to make attention tangible: “I know you well enough to choose these for you.”", "source": "Kumar & Epley (2023), Journal of Experimental Psychology: General: underestimating the impact of kindness"}, "pillar": "EXPRESSION", "modes": ["make", "people"]}, {"id": "ANC-0603", "dim": "SOCIAL", "priority": false, "name": "Perform something, even badly", "min": 20, "type": "Anchor", "instruction": "Sing, read, dance, or otherwise perform something in front of at least one other person this week: karaoke, an open mic, a friend's living room, a campus talent night. It does not have to be good.", "learnMore": "The point is not the performance, it is doing something slightly exposing on purpose and finding out the anticipated cost was higher than the real one. Mastery experiences, doing the actual thing rather than only thinking about it, are the single strongest source of the self-belief that makes the next hard thing easier.", "makeEasier": "Perform it alone in your room first, out loud, before deciding whether to do it in front of someone.", "safety": "Choose a setting that is actually safe and consensual. This is not license to perform anything unwelcome or unsafe to an audience that did not opt in.", "evidence": "Bandura (1977), Psychological Review, self-efficacy and mastery experience", "link": "", "wk": null, "pillar": "EXPRESSION", "modes": ["make", "people", "learn"]}, {"id": "ANC-0021", "dim": "SPIRITUAL", "priority": false, "name": "Best possible ordinary Tuesday", "min": 15, "type": "Anchor", "instruction": "Imagine an ordinary weekday five years from now. Write where you wake, what work occupies you, who you speak with, and what you do in the evening. Underline one thing you could rehearse this week.", "learnMore": "Make it ordinary, not a fantasy vacation or perfect highlight reel. The useful details are the boring ones: where you live, how mornings feel, what fills your time, who is around, and what you do when nobody is watching.", "makeEasier": "Write three future details and one thing to rehearse this week.", "safety": "Keep the exercise grounded; pause if future imagery becomes destabilizing.", "evidence": "King (2001), Personality and Social Psychology Bulletin, “The health benefits of writing about life goals”", "link": "", "wk": {"title": "Make the future ordinary", "editorial": "In Laura King’s writing studies, people repeatedly wrote about their best possible future and later reported more positive mood than comparison groups. This short Anchor is not the same intervention. Its use is simpler: make the future ordinary enough that you can spot one piece worth rehearsing now.", "source": "King (2001), Personality and Social Psychology Bulletin, “The health benefits of writing about life goals”"}, "pillar": "PEACE", "modes": ["make"]}, {"id": "ANC-0309", "dim": "SPIRITUAL", "priority": false, "name": "Awe walk", "min": 15, "type": "Anchor", "instruction": "Take a fifteen-minute walk with no headphones. Look for something physically larger, older, more intricate, or more surprising than you expected. Give it your full attention.", "learnMore": "This is different from a mindfulness walk: you are looking for something that changes your scale. A huge tree, old building, storm cloud, tiny insect pattern, or complicated machine can all count.", "makeEasier": "Step outside for three minutes and find one thing larger, older, or more intricate than normal.", "safety": "Choose a safe route and environment; awe does not require isolation or risk.", "evidence": "Sturm et al. (2020), Emotion", "link": "", "wk": {"title": "Look for something bigger than you", "editorial": "Awe happens when you encounter something that stretches your usual frame of reference (ex. an old tree, a remarkable building, even an intricate pattern you almost missed). In an eight-week experiment, people asked to deliberately look for awe during short walks experienced more awe, more positive social emotions, and less day-to-day distress than people who simply walked. The point is not to feel unimportant; it is to let your attention widen.", "source": "Sturm et al. (2020), Emotion"}, "pillar": "PEACE", "modes": ["move", "outdoors"]}, {"id": "ANC-0532", "dim": "SPIRITUAL", "priority": false, "name": "Ten minutes of wishing people well", "min": 10, "type": "Anchor", "instruction": "Sit quietly and, one at a time, wish a few specific people well: someone you love, someone neutral, yourself. A plain sentence for each: may you be well, may this be easier than you think.", "learnMore": "Loving-kindness practice has a medium-sized effect on positive emotion across two dozen studies. The authors are careful about it (many of the trials used waitlist controls, which do not rule out expectation) so treat it as promising rather than settled, and judge it by whether ten minutes leaves you better.", "makeEasier": "Wish one person well, once.", "safety": "If directing this at yourself brings up self-criticism, stop and choose another Anchor.", "evidence": "Zeng, Chiu, Wang, Oei & Leung (2015), Frontiers in Psychology 6:1693: meta-analytic review", "link": "", "wk": {"title": "Promising, with a caveat worth stating", "editorial": "Across 24 studies and about 1,760 participants, loving-kindness meditation showed a medium effect on positive emotion (g ≈ .42 for loving-kindness focused programmes). The authors flag their own limitation directly: many trials used waitlist controls, which do not rule out expectancy, so the pooled figure may be an overestimate. Worth trying, worth judging by your own result.", "source": "Zeng, Chiu, Wang, Oei & Leung (2015), Frontiers in Psychology 6:1693: meta-analytic review"}, "pillar": "PEACE", "modes": ["people", "quiet"]}, {"id": "ANC-0601", "dim": "SPIRITUAL", "priority": false, "name": "Ten minutes of prayer, scripture, or guided meditation", "min": 10, "type": "Anchor", "instruction": "Choose whichever fits your own practice: pray in your own words or tradition, read or listen to a passage of scripture, or run a guided meditation. Ten minutes, phone away except for audio.", "learnMore": "Contemplative practice research (prayer, scripture engagement, and meditation alike) links regular practice with better coping and lower distress across traditions, though the effect is easiest to find in people for whom the practice is already personally meaningful. This Anchor is deliberately open-ended: it names three forms and lets you pick, rather than defaulting to one tradition.", "makeEasier": "Two minutes instead of ten, in whichever of the three forms is easiest to start.", "safety": "This is opt-in and never assumed. If none of the three forms fit you, choose a different Anchor.", "evidence": "Koenig (2012), ISRN Psychiatry, review of religion, spirituality, and health research", "link": "", "wk": null, "pillar": "PEACE", "modes": ["move", "quiet", "learn"]}], "quotes": [{"quote": "Men are disturbed not by things, but by the views which they take of them.", "author": "Epictetus", "source": "Enchiridion, §5 (George Long trans.)"}, {"quote": "Begin anywhere.", "author": "John Cage", "source": "Diary: How to Improve the World (You Will Only Make Matters Worse)"}, {"quote": "I exist as I am, that is enough.", "author": "Walt Whitman", "source": "Song of Myself, §20"}, {"quote": "Well done is better than well said.", "author": "Benjamin Franklin", "source": "Poor Richard, 1737"}, {"quote": "For it is not enough to have a good mind. The main thing is to apply it well.", "author": "René Descartes", "source": "Discourse on Method, Part I (trans.)"}, {"quote": "Reading furnishes the mind only with materials of knowledge; it is thinking makes what we read ours.", "author": "John Locke", "source": "Of the Conduct of the Understanding, §20"}, {"quote": "What do we live for, if it is not to make life less difficult to each other?", "author": "George Eliot", "source": "Middlemarch, Chapter 72"}, {"quote": "Live in each season as it passes.", "author": "Henry David Thoreau", "source": "Journal, 23 August 1853"}, {"quote": "If a thing is worth doing, it is worth doing badly.", "author": "G. K. Chesterton", "source": "What's Wrong with the World, IV.14"}, {"quote": "Great works are performed not by strength, but perseverance.", "author": "Samuel Johnson", "source": "The History of Rasselas, Prince of Abissinia"}, {"quote": "We are what we repeatedly do. Excellence, then, is not an act but a habit.", "author": "Will Durant", "source": "The Story of Philosophy (1926), chapter on Aristotle"}, {"quote": "Try to be a rainbow in someone’s cloud.", "author": "Maya Angelou", "source": "Letter to My Daughter (2008)"}, {"quote": "My experience is what I agree to attend to.", "author": "William James", "source": "The Principles of Psychology (1890), Chapter XI"}, {"quote": "The good life is a process, not a state of being. It is a direction not a destination.", "author": "Carl R. Rogers", "source": "On Becoming a Person (1961)"}, {"quote": "Tell me, what is it you plan to do with your one wild and precious life?", "author": "Mary Oliver", "source": "“The Summer Day,” House of Light (1990)"}, {"quote": "Art does not reproduce the visible; rather, it makes visible.", "author": "Paul Klee", "source": "Creative Credo (1920), §I"}, {"quote": "“We suffer more often in imagination than in reality.”", "author": "Seneca", "source": "Moral Letters to Lucilius, Letter 13"}, {"quote": "“Nothing can bring you peace but yourself.”", "author": "Ralph Waldo Emerson", "source": "Self-Reliance"}, {"quote": "“The unexamined life is not worth living.”", "author": "Socrates / Plato", "source": "Apology, 38a"}, {"quote": "“For the things we have to learn before we can do them, we learn by doing them.”", "author": "Aristotle", "source": "Nicomachean Ethics, II.1"}, {"quote": "“The superior man is modest in his speech, but exceeds in his actions.”", "author": "Confucius", "source": "Analects, XIV"}, {"quote": "“To strive, to seek, to find, and not to yield.”", "author": "Alfred Tennyson", "source": "Ulysses"}, {"quote": "“Forever is composed of Nows.”", "author": "Emily Dickinson", "source": "“Forever—is composed of Nows—”"}, {"quote": "“We are all in the gutter, but some of us are looking at the stars.”", "author": "Oscar Wilde", "source": "Lady Windermere’s Fan, Act III"}, {"quote": "“There is nothing either good or bad but thinking makes it so.”", "author": "William Shakespeare", "source": "Hamlet, II.2"}, {"quote": "“Nothing great was ever achieved without enthusiasm.”", "author": "Ralph Waldo Emerson", "source": "“Circles,” Essays: First Series"}, {"quote": "“Only those thoughts that come by walking have any value.”", "author": "Friedrich Nietzsche", "source": "Twilight of the Idols, §34"}, {"quote": "“To affect the quality of the day, that is the highest of arts.”", "author": "Henry David Thoreau", "source": "Walden"}, {"quote": "“You must change your life.”", "author": "Rainer Maria Rilke", "source": "“Archaic Torso of Apollo”"}], "reflections": [{"prompt": "What did you do this week that felt most like you?", "fits": "ANY|VALUES", "care": false}, {"prompt": "What are you doing mostly because other people expect it?", "fits": "VALUES|SOCIAL", "care": true}, {"prompt": "What are you proud you handled well lately?", "fits": "ANY", "care": false}, {"prompt": "What are you avoiding because you want to do it perfectly?", "fits": "HIGH_LOAD", "care": true}, {"prompt": "Who have you felt most yourself around lately?", "fits": "SOCIAL", "care": false}, {"prompt": "Who have you not really checked in on lately?", "fits": "SOCIAL", "care": false}, {"prompt": "What do you usually reach for your phone to avoid?", "fits": "HIGH_SCREEN", "care": true}, {"prompt": "What tends to happen late in the night that you wish you had decided earlier?", "fits": "SUBSTANCE|SOCIAL", "care": true}, {"prompt": "What does your body need more of this week: sleep, food, movement, or quiet?", "fits": "LOW_RECOVERY", "care": false}, {"prompt": "What are you spending time on that matters less than the time you give it?", "fits": "VALUES", "care": true}, {"prompt": "What do you want people close to you to be able to count on you for?", "fits": "VALUES|SOCIAL", "care": false}]};

<script>

// tappable "?" explainer: appends a ? button to labelEl and a collapsible note to parent
function addQ(parent,labelEl,text){

 const exp=$(`<div class="qexp" style="display:none">${text}</div>`);
 q.onclick=(e)=>{e.preventDefault();exp.style.display=exp.style.display==='none'?'block':'none';};
 labelEl.appendChild(q);parent.appendChild(labelEl);parent.appendChild(exp);
}

// ---------- persistence ----------
const KEY="anchor_app_v2";
// ===== CLOUD SYNC (optional) — paste your Supabase values to turn on accounts + cross-device save =====
const SUPABASE_URL="https://glblfvegysssqosdltxg.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_HsgL-uSlcEEAat6Kx7FnMw_WahphBP6";
let supa=null,user=null,saveTmr=null;
let S=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.v===2?x:fresh();}catch(e){return fresh();}}
function fresh(){return{v:2,onboarded:false,profile:{},log:[],journal:[],served:[],exclude:[],
  memory:{values:[],goal:""},learn:{pillar:{PEACE:0,STABILITY:0,EXPRESSION:0},mode:{},effort:0},
  tab:"today",today:null,compassNew:false,contextToday:null,theme:""};}
